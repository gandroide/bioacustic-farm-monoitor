; ==========================================================
; Proyecto: BIO-ALERT (AXIS.ops)
; Nodo: BIO-ACOUSTIC-BREATH (Módulo Respiratorio)
; Estado: EN ESPERA / PLACEHOLDER
; ==========================================================
;
; Este archivo es un marcador de posición para el futuro
; desarrollo del nodo "Breath".
;
; Actualmente contiene la configuración base para que
; PlatformIO reconozca la carpeta dentro del Monorepo.
;
; Mismo hardware que bio-acoustic-health (ESP32-S3 + INMP441 + SD).
; No se prevé placa distinta: la divergencia es de software.
;
; PROXIMAMENTE:
; - lib_extra_dirs apuntando a firmware/common/ (núcleo compartido).
; - arduinoFFT y demás dependencias de análisis, al implementar la lógica.
; ==========================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Velocidad base del Monitor Serial
monitor_speed = 115200

; Banderas de comunicación nativa USB para Mac
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; I2S, SPI, SD y Preferences (NVS) son nativas.
lib_deps =
    kosme/arduinoFFT@^2.0.2